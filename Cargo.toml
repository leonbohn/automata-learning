[package]
name = "automata-learning"
version = "0.1.0"
edition = "2024"
description = "Passive and active learning algorithms for automata (RPNI-style sprout, DPAInf, L*)."
repository = "https://github.com/leonbohn/automata-learning"
homepage = "https://github.com/leonbohn/automata-learning"
readme = "README.md"
license = "MIT"
authors = ["León Bohn <bohn@lics.rwth-aachen.de>"]

[dependencies]
tracing = "0.1"
itertools = "0.15"
bimap = "0.6"
thiserror = "2.0"
crossbeam-channel = "0.5.14"
rand = "0.8.5"
tabled = { version = "0.22", features = ["ansi"] }

owo-colors = "4.2.0"
alea = "0.2"
either = "1.14.0"
paste = "1.0"
fixedbitset = "0.5.7"

automata = { git = "https://github.com/leonbohn/automata", features = ["hoa", "render", "graphviz"] }

[dev-dependencies]
test-log = { version = "0.2.17", features = ["trace"] }
